name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No install step on purpose: the suite runs the real client.js inside a node:vm
      # sandbox using only Node builtins, so there is nothing to fetch and nothing to break.
      - name: Run the static audit suite
        run: node test/smoke.mjs
